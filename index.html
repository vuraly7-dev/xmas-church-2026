<style>

<script>

/* ===== 聲音：全部由本頁程式即時合成，不使用任何錄音或音效檔 =====
   背景音樂為公有領域的傳統聖誕詩歌旋律，以音樂盒音色重新演奏：
   〈Silent Night 平安夜〉Franz Xaver Gruber，1818
   〈Joy to the World 普世歡騰〉Lowell Mason 編曲，1839 */
const Snd=(()=>{
  const N={C3:130.81,D3:146.83,E3:164.81,F3:174.61,G3:196,A3:220,B3:246.94,C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392,A4:440,B4:493.88,
    C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99,A5:880,B5:987.77,C6:1046.5,D6:1174.66,E6:1318.51,F6:1396.91,G6:1567.98};
  const SONGS=[
    {bpm:62,bar:6,mel:"G5 1.5,A5 .5,G5 1,E5 3,G5 1.5,A5 .5,G5 1,E5 3,D6 2,D6 1,B5 3,C6 2,C6 1,G5 3,A5 2,A5 1,C6 1.5,B5 .5,A5 1,G5 1.5,A5 .5,G5 1,E5 3,A5 2,A5 1,C6 1.5,B5 .5,A5 1,G5 1.5,A5 .5,G5 1,E5 3,D6 2,D6 1,F6 1.5,D6 .5,B5 1,C6 3,E6 3,C6 1,G5 1,E5 1,G5 1.5,F5 .5,D5 1,C5 6",
     bass:"C3 C3 G3 C3 F3 C3 F3 C3 G3 C3 G3 C3"},
    {bpm:84,bar:4,mel:"C6 1,B5 .75,A5 .25,G5 1.5,F5 .5,E5 1,D5 1,C5 1.5,G5 .5,A5 1.5,A5 .5,B5 1.5,B5 .5,C6 3,C6 .5,C6 .5,B5 .5,A5 .5,G5 .5,G5 .75,F5 .25,E5 .5,C6 .5,C6 .5,B5 .5,A5 .5,G5 .5,G5 .75,F5 .25,E5 .5,E5 .5,E5 .5,E5 .5,E5 .5,E5 .5,F5 .25,G5 1.25,F5 .5,E5 .5,D5 .5,D5 .5,D5 .5,D5 .25,E5 .25,F5 1.5,E5 .5,D5 .5,C5 .5,C6 1,A5 .5,G5 .75,F5 .25,E5 .5,F5 .5,E5 1,D5 1,C5 3",
     bass:""}
  ];
  let ctx=null, mus=null, sfx=null, musicOn=true, started=false, timer=null, si=0, ni=0, t0=0, notes=[], beat=0, unlocked=false;
  function iosUnlock(){
    try{ const sr=8000,len=sr/2,buf=new ArrayBuffer(44+len*2),v=new DataView(buf);
      const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
      w(0,"RIFF");v.setUint32(4,36+len*2,true);w(8,"WAVEfmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
      v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,len*2,true);
      const a=new Audio(URL.createObjectURL(new Blob([buf],{type:"audio/wav"}))); a.loop=true; a.setAttribute("playsinline",""); a.volume=.01; a.play().catch(()=>{});
    }catch(e){}
  }
  function ensure(){
    if(!ctx){ ctx=new (window.AudioContext||window.webkitAudioContext)();
      mus=ctx.createGain(); mus.gain.value=.22; mus.connect(ctx.destination);
      sfx=ctx.createGain(); sfx.gain.value=.45; sfx.connect(ctx.destination); }
    if(!unlocked){ unlocked=true; iosUnlock(); }
    if(ctx.state!=="running") ctx.resume();
  }
  // 純淨的音樂盒音色：單一正弦波＋柔和泛音，快速起音、自然衰減，避免雜音
  function box(out,f,t,vol,len){
    const o=ctx.createOscillator(), g=ctx.createGain(); o.type="sine"; o.frequency.value=f;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.012); g.gain.exponentialRampToValueAtTime(.0005,t+len);
    o.connect(g).connect(out); o.start(t); o.stop(t+len+.05);
    const o2=ctx.createOscillator(), g2=ctx.createGain(); o2.type="sine"; o2.frequency.value=f*2;
    g2.gain.setValueAtTime(0,t); g2.gain.linearRampToValueAtTime(vol*.12,t+.01); g2.gain.exponentialRampToValueAtTime(.0005,t+len*.5);
    o2.connect(g2).connect(out); o2.start(t); o2.stop(t+len*.5+.05);
  }
  function load(at){
    const s=SONGS[si%SONGS.length]; notes=s.mel.split(",").map(x=>{const [n,d]=x.trim().split(" "); return [n,parseFloat(d)];});
    ni=0; beat=60/s.bpm; t0=at;
    if(s.bass) s.bass.split(" ").forEach((n,i)=>box(mus,N[n],at+i*s.bar*beat,.10,s.bar*beat*.9));
  }
  function tick(){
    if(!ctx||!musicOn) return;
    const ahead=ctx.currentTime+.7;
    while(t0<ahead){
      if(ni>=notes.length){ si++; load(t0+beat*4); continue; }
      const [n,d]=notes[ni++]; box(mus,N[n],t0,.16,Math.max(.8,d*beat*1.5)); t0+=d*beat;
    }
  }
  function tone(f1,f2,t,len,vol){
    const o=ctx.createOscillator(), g=ctx.createGain(); o.type="sine";
    o.frequency.setValueAtTime(f1,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+len*.8);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.0005,t+len);
    o.connect(g).connect(sfx); o.start(t); o.stop(t+len+.05);
  }
  const PENTA=[1046.5,1174.66,1318.51,1567.98,1760,2093,2349.32,2637.02,3135.96,3520,4186.01,4698.63];
  const FX={
    tap(t){ tone(1320,0,t,.08,.22); },
    sheep(t){ tone(420,520,t,.12,.25); tone(520,400,t+.1,.16,.2); },
    spark(t,i){ const f=PENTA[(i||0)%PENTA.length]; tone(f,0,t,.6,.16); tone(f*1.5,0,t+.02,.3,.04); },
    step(t){ tone(110,70,t,.14,.35); },
    star(t){ [523.25,659.25,783.99,1046.5,1318.51].forEach((f,i)=>tone(f,0,t+i*.12,.8,.16)); },
    send(t){ tone(520,1560,t,.3,.2); }
  };
  return {
    start(){ try{ ensure(); if(!started){ started=true; load(ctx.currentTime+.4); } musicOn=true; clearInterval(timer); timer=setInterval(tick,150); tick(); }catch(e){} },
    fx(name,arg){ try{ ensure(); FX[name](ctx.currentTime+.01,arg); }catch(e){} },
    toggleMusic(){ if(!ctx){ this.start(); return true; } musicOn=!musicOn;
      if(musicOn){ mus.gain.setTargetAtTime(.22,ctx.currentTime,.1); t0=Math.max(t0,ctx.currentTime+.1); } else mus.gain.setTargetAtTime(0,ctx.currentTime,.05);
      return musicOn; },
    pause(h){ if(!ctx) return; try{ h? ctx.suspend() : ctx.resume(); }catch(e){} }
  };
})();
document.addEventListener("visibilitychange",()=>Snd.pause(document.hidden));


/* ===== 分享工具：手機分享選單＋結果圖卡（圖卡在瀏覽器內用 canvas 產生，不上傳任何資料） ===== */
const Share=(()=>{
  const siteUrl=()=> /claude|anthropic|usercontent/.test(location.hostname)||location.protocol==="file:" ? "" : location.origin+location.pathname;
  async function copy(s){ try{ await navigator.clipboard.writeText(s); return true; }catch(e){ return false; } }
  // LINE 與部分 App 不接受「文字＋網址」同時分享，所以把網址併進文字裡，只送一種內容
  async function text(msg, toastFn){
    const url=siteUrl(), full=msg+(url?"\n"+url:"");
    if(navigator.share && url){
      try{ await navigator.share({text:full}); return; }
      catch(e){ if(e && e.name==="AbortError") return; }
    }
    const ok=await copy(full);
    toastFn(ok?"已複製！貼給朋友吧 🎄":"無法自動複製，截圖分享也可以 📸");
  }
  // LINE 官方分享網址：在手機上會直接打開 LINE 的分享畫面
  function lineHref(msg){ const url=siteUrl(); return "https://line.me/R/share?text="+encodeURIComponent(msg+(url?"\n"+url:"")); }
  function wrap(ctx, str, maxW){
    const out=[]; let line="";
    for(const ch of [...str]){
      if(ch==="\n"){ out.push(line); line=""; continue; }
      if(ctx.measureText(line+ch).width>maxW && line){ out.push(line); line=ch; } else line+=ch;
    }
    if(line) out.push(line); return out;
  }
  function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  async function card(o){
    try{ await document.fonts.ready; }catch(e){}
    const W=1080,H=1350,c=document.createElement("canvas"); c.width=W; c.height=H; const x=c.getContext("2d");
    const g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,o.bg1); g.addColorStop(1,o.bg2); x.fillStyle=g; x.fillRect(0,0,W,H);
    const sans='"Noto Sans TC",system-ui,sans-serif', serif='"Noto Serif TC","Noto Sans TC",serif';
    x.textAlign="center"; x.fillStyle=o.accent; x.font=`700 34px ${sans}`; x.fillText(o.kicker, W/2, 120);
    x.font=`140px ${sans}`; x.fillText(o.emoji||"🎄", W/2, 300);
    x.fillStyle=o.text; x.font=`900 84px ${serif}`;
    let y=430; for(const l of wrap(x,o.title,W-160)){ x.fillText(l,W/2,y); y+=100; }
    if(o.sub){ x.fillStyle=o.accent2||o.accent; x.font=`700 40px ${sans}`; for(const l of wrap(x,o.sub,W-180)){ x.fillText(l,W/2,y); y+=56; } }
    y+=20;
    const rows=o.rows||[], bh=96, by=y;
    if(rows.length){
      x.fillStyle="rgba(255,255,255,.09)"; rr(x,90,by,W-180,rows.length*bh+30,32); x.fill();
      rows.forEach((r,i)=>{ const ry=by+30+i*bh+52;
        x.textAlign="left"; x.fillStyle=o.muted; x.font=`500 36px ${sans}`; x.fillText(r[0],140,ry);
        x.textAlign="right"; x.fillStyle=o.text; x.font=`900 44px ${sans}`;
        let v=r[1]; while(x.measureText(v).width>W-560 && v.length>2) v=v.slice(0,-2)+"…"; x.fillText(v,W-140,ry); });
      y=by+rows.length*bh+30+60;
    }
    if(o.tags && o.tags.length){
      x.textAlign="center"; x.font=`500 34px ${sans}`; x.fillStyle=o.muted;
      for(const l of wrap(x,o.tags.join("  "),W-180)){ x.fillText(l,W/2,y); y+=50; }
    }
    x.textAlign="center"; x.fillStyle=o.text; x.font=`700 40px ${sans}`; x.fillText(o.cta||"你也來玩玩看 👉", W/2, H-170);
    x.fillStyle=o.muted; x.font=`500 30px ${sans}`; x.fillText(siteUrl().replace(/^https?:\/\//,"")||"聖誕節線上小遊戲 2026", W/2, H-115);
    x.font=`500 24px ${sans}`; x.fillText("© 2026 liva", W/2, H-70);
    return c;
  }
  function modal(dataUrl, canShareFile, onShare){
    const m=document.createElement("div");
    m.style.cssText="position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:12px;font-family:'Noto Sans TC',sans-serif";
    m.innerHTML=`<img src="${dataUrl}" alt="結果圖卡" style="max-width:100%;max-height:68vh;border-radius:14px;box-shadow:0 10px 40px #000">
      <div style="color:#ddd;font-size:13px;text-align:center;line-height:1.7">手機可<b style="color:#fff">長按圖片</b>儲存，再分享到限動<br>傳 LINE：先存圖片，再到 LINE 聊天室傳送最穩定</div>
      <div style="display:flex;gap:8px;width:100%;max-width:420px">
        ${canShareFile?'<button data-a="share" style="flex:1;font:inherit;font-weight:700;padding:13px;border:0;border-radius:12px;background:#e3263f;color:#fff">分享圖片</button>':''}
        <a data-a="dl" download="xmas-result.png" href="${dataUrl}" style="flex:1;text-align:center;text-decoration:none;font-weight:700;padding:13px;border-radius:12px;background:#fff;color:#111">下載圖片</a>
        <button data-a="close" style="flex:1;font:inherit;font-weight:700;padding:13px;border:1px solid #fff6;border-radius:12px;background:transparent;color:#fff">關閉</button>
      </div>`;
    m.addEventListener("click",e=>{ const a=e.target.closest("[data-a]"); if(!a){ if(e.target===m) m.remove(); return; }
      if(a.dataset.a==="close") m.remove(); if(a.dataset.a==="share") onShare(); });
    document.body.appendChild(m);
  }
  async function image(opts, msg, toastFn){
    try{
      const c=await card(opts), url=c.toDataURL("image/png");
      let file=null; try{ const blob=await new Promise(r=>c.toBlob(r,"image/png")); file=new File([blob],"xmas-result.png",{type:"image/png"}); }catch(e){}
      const canShareFile=!!(file && navigator.canShare && navigator.canShare({files:[file]}));
      modal(url, canShareFile, async()=>{ try{ await navigator.share({files:[file]}); }catch(e){} });
    }catch(e){ toastFn("圖卡產生失敗，截圖分享也可以 📸"); }
  }
  return {text, image, siteUrl, lineHref};
})();

/* ===== 資料：佳音鏈存在網址 #g= 裡，不經過任何伺服器 ===== */
const MAX_KEEP = 24, NAME_MAX = 8, BLESS_MAX = 14;
const ORIGIN = {n:1, c:[["天使","不要懼怕！大喜的信息"]]};
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clip = (s,n) => [...String(s||"")].slice(0,n).join("");
function enc(o){ const b=btoa(unescape(encodeURIComponent(JSON.stringify(o)))); return b.replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function dec(s){
  try{
    s=s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4) s+="=";
    const o=JSON.parse(decodeURIComponent(escape(atob(s))));
    if(!o || !Array.isArray(o.c) || !o.c.length) return null;
    const c=o.c.slice(-MAX_KEEP).filter(x=>Array.isArray(x)).map(x=>[clip(x[0],NAME_MAX)||"一位朋友", clip(x[1],BLESS_MAX)]);
    const n=Math.max(c.length, Math.min(999999, parseInt(o.n)||c.length));
    return {n, c};
  }catch(e){ return null; }
}
function readChain(){
  const m=(location.hash||"").match(/g=([A-Za-z0-9_-]+)/);
  return (m && dec(m[1])) || null;
}
const baseUrl = () => location.origin + location.pathname;

const S = { chain:null, first:false, me:null };
const app = document.getElementById("app"), stage=document.getElementById("stage");
const sleep = ms => new Promise(r=>setTimeout(r,ms));

/* ===== 星空背景 ===== */
const cv=document.getElementById("sky"), cx=cv.getContext("2d"); let stars=[];
function resize(){ const w=stage.clientWidth,h=stage.clientHeight,d=devicePixelRatio||1; cv.width=w*d; cv.height=h*d; cv.style.width=w+"px"; cv.style.height=h+"px"; cx.setTransform(d,0,0,d,0,0);
  stars=Array.from({length:150},()=>({x:Math.random()*w,y:Math.random()*h*.85,r:Math.random()*1.3+.2,p:Math.random()*6.28})); }
function twinkle(t){ const w=stage.clientWidth,h=stage.clientHeight; cx.clearRect(0,0,w,h);
  for(const s of stars){ cx.globalAlpha=.35+.65*Math.abs(Math.sin(t/1400+s.p)); cx.fillStyle="#fff"; cx.beginPath(); cx.arc(s.x,s.y,s.r,0,6.28); cx.fill(); }
  cx.globalAlpha=1; requestAnimationFrame(twinkle); }
addEventListener("resize",resize); resize(); requestAnimationFrame(twinkle);

/* ===== 星座圖 ===== */
function hash(str){ let h=2166136261; for(const ch of str){ h^=ch.codePointAt(0); h=Math.imul(h,16777619); } return (h>>>0)/4294967295; }
function constellation(list, highlightLast){
  const W=100, H=100, n=list.length;
  const pts=list.map((x,i)=>{
    const t = n===1 ? .5 : i/(n-1);
    const y = 90 - t*78;
    const x0 = 50 + Math.sin(i*1.3 + hash(x[0]+i)*3)*28 + (hash(x[0]+"x"+i)-.5)*14;
    return [Math.max(8,Math.min(92,x0)), y];
  });
  let path=""; pts.forEach((p,i)=>{ path+=(i?"L":"M")+p[0]+" "+p[1]+" "; });
  const circles=pts.map((p,i)=>{
    const last = highlightLast && i===n-1, first=i===0;
    const r = last?2.6:first?2.2:1.4;
    const col = last?"#fff":first?"#ffe9a8":"#f6d47a";
    const label = (last||first||n<=8||i%Math.ceil(n/6)===0) ? `<text x="${p[0]+ (p[0]>70?-3:3)}" y="${p[1]+1}" font-size="3.4" fill="${last?"#fff":"#cfd6e6"}" text-anchor="${p[0]>70?"end":"start"}" font-family="Noto Sans TC">${esc(list[i][0])}</text>`:"";
    return `<circle cx="${p[0]}" cy="${p[1]}" r="${r*2.4}" fill="${col}" opacity=".18"><animate attributeName="opacity" values=".1;.35;.1" dur="${2+i%3}s" repeatCount="indefinite"/></circle>
            <circle cx="${p[0]}" cy="${p[1]}" r="${r}" fill="${col}">${last?'<animate attributeName="r" values="2.2;3.2;2.2" dur="1.6s" repeatCount="indefinite"/>':""}</circle>${label}`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    <path d="${path}" fill="none" stroke="#f6d47a" stroke-width=".35" stroke-dasharray="1 1.2" opacity=".75"/>
    ${circles}</svg>`;
}
function chainHTML(list, offset){
  return list.slice().reverse().map((x,i)=>{
    const idx = offset + list.length - i;
    return `<div><b>${esc(x[0])}</b><span>${esc(x[1]||"")}</span><i>第 ${idx} 站</i></div>`;
  }).join("");
}

/* ===== 0. 抵達 ===== */
function arrive(){
  const ch = readChain();
  S.first = !ch; S.chain = ch || JSON.parse(JSON.stringify(ORIGIN));
  const n=S.chain.n, list=S.chain.c, offset=n-list.length;
  app.innerHTML=`<div class="scene">
    <div class="k">聖誕佳音接力</div>
    <h1>${S.first?"兩千年前的好消息，<br>今晚<em>傳到你了</em>":"這個佳音，<br><em>傳到你了</em>"}</h1>
    ${S.first
      ?`<p class="lead">從伯利恆的夜晚開始，<br>這個好消息一站一站傳到今天。<br>現在，由你接下第 2 棒。</p>`
      :`<div class="count" style="margin-top:6px">${n}<small> 站</small></div><p class="lead">這個好消息已經經過 ${n} 站，<br>最後一位是 <b style="color:var(--gold2)">${esc(list[list.length-1][0])}</b>，把它傳給了你。</p>`}
    <div class="const">${constellation(list,false)}</div>
    ${S.first?"":`<div class="chainlist">${chainHTML(list.slice(-6), n-Math.min(6,list.length))}</div>`}
    <button class="btn" id="go">收下這個佳音（約 2 分鐘）</button>
    <a class="treelink" href="./tree.html" style="display:none;text-align:center;color:var(--gold);font-size:14px;margin-top:12px;text-decoration:none">🎄 另一個遊戲：爬上聖誕樹（經文闖關）→</a>
    <div class="foot">有聖誕詩歌背景音樂，可按右上角 🎵 關閉<br>純屬原創互動故事・經文取自《和合本》・© 2026 liva</div>
  </div>`;
  showTree();
  document.getElementById("go").onclick=()=>{ Snd.start(); Snd.fx("tap"); document.getElementById("mb").style.display="block"; sheep(); };
}

/* ===== 1. 看守羊群 ===== */
function sheep(){
  app.innerHTML=`<div class="scene">
    <div class="k">第一幕・伯利恆的野地</div>
    <p class="verse" style="margin-top:14px">在伯利恆之野地裡有牧羊的人，<br>夜間按著更次看守羊群。<small>路加福音 2:8</small></p>
    <p class="hint">你是值夜班的牧羊人。羊走散了，點牠們帶回火堆旁！</p>
    <div class="bar"><i id="bar"></i></div>
    <div class="field" id="field"><div class="fire">🔥</div></div>
  </div><div class="hills"></div>`;
  const F=document.getElementById("field"), fw=()=>F.clientWidth, fh=()=>F.clientHeight;
  const home=i=>[fw()/2-19+Math.cos(i*1.05)*58, fh()*.62+Math.sin(i*1.05)*34];
  const sh=[];
  for(let i=0;i<6;i++){ const d=document.createElement("div"); d.className="sheep"; d.textContent="🐑";
    const [x,y]=home(i); d.style.left=x+"px"; d.style.top=y+"px"; F.appendChild(d); sh.push(d);
    d.addEventListener("pointerdown",e=>{ e.preventDefault(); if(!d.classList.contains("stray")) return; d.classList.remove("stray"); Snd.fx("sheep"); const [hx,hy]=home(i); d.style.left=hx+"px"; d.style.top=hy+"px"; saved++; }); }
  let saved=0, t=0; const DUR=16;
  const iv=setInterval(()=>{ t+=1; document.getElementById("bar").style.width=Math.min(100,t/DUR*100)+"%";
    const calm=sh.filter(s=>!s.classList.contains("stray"));
    if(calm.length && t<DUR-1){ const s=calm[Math.floor(Math.random()*calm.length)]; s.classList.add("stray");
      s.style.left=(Math.random()<.5? 4+Math.random()*30 : fw()-60-Math.random()*30)+"px"; s.style.top=(fh()*.18+Math.random()*fh()*.5)+"px"; }
    if(t>=DUR){ clearInterval(iv); sh.forEach((s,i)=>{ s.classList.remove("stray"); const [x,y]=home(i); s.style.left=x+"px"; s.style.top=y+"px"; }); setTimeout(angels,1400); }
  },1000);
}

  </div>`;
  const txt=`有一個從兩千年前傳來的好消息，已經經過 ${nx.n} 站，現在傳到你手上了 🌟\n${S.me[0]}：「${S.me[1]}」`;

      kicker:"聖誕佳音接力・這個佳音，傳到你了", emoji:"🌟", title:`我是第 ${nx.n} 站`, sub:`「${S.me[1]}」`,
      rows:[["我的名字",S.me[0]],["從誰手上接到",prev],["起點","伯利恆的天使"]],

    setTimeout(()=>toast("圖片不會附帶連結，記得也把連結傳給朋友喔"),2600);

}
function showTree(){ if(/claude|anthropic|usercontent/.test(location.hostname)||location.protocol==="file:") return; document.querySelectorAll(".treelink").forEach(a=>a.style.display="block"); }
async function copy(s){ try{ await navigator.clipboard.writeText(s); toast("已複製！貼給你想祝福的人 🌟"); }catch(e){ toast("請長按網址列複製連結"); } }
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2400); }

document.getElementById("mb").onclick=()=>{ const on=Snd.toggleMusic(); document.getElementById("mb").textContent=on?"🎵":"🔇"; Snd.fx("tap"); };
arrive();
