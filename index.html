<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans TC",system-ui,sans-serif;min-height:100vh;min-height:100dvh;color:#f4f1ea;
  background:radial-gradient(ellipse at 50% 0%,#1b2350 0%,#0d1433 45%,#05071a 100%);display:flex;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top) + 32px) 18px calc(env(safe-area-inset-bottom) + 32px)}
canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;width:100%;max-width:460px}
.star{font-size:46px;text-align:center;filter:drop-shadow(0 0 18px #ffe9a8);animation:tw 2s ease-in-out infinite}
@keyframes tw{50%{transform:scale(1.12);filter:drop-shadow(0 0 30px #fff4c9)}}
.k{text-align:center;font-size:12px;letter-spacing:.3em;color:#f6d47a;margin-top:6px}
h1{font-family:"Noto Serif TC",serif;font-weight:900;font-size:34px;text-align:center;margin:10px 0 6px;line-height:1.35}
.sub{text-align:center;color:#a8b3c9;font-size:14px;line-height:1.8;margin-bottom:24px}
a.card{display:flex;gap:14px;align-items:center;text-decoration:none;color:inherit;background:#ffffff0d;border:1px solid #ffffff22;border-radius:18px;padding:18px;margin-bottom:12px;transition:.15s}
a.card:hover{border-color:#f6d47a;background:#ffffff16;transform:translateY(-2px)}
.e{font-size:42px;flex:none;width:56px;text-align:center}
b{display:block;font-size:17px;margin-bottom:3px}
span{font-size:14px;color:#a8b3c9;line-height:1.6}
.verse{text-align:center;font-family:"Noto Serif TC",serif;color:#ffe9a8;font-size:15px;line-height:1.9;margin:22px 0 4px}
.verse small{display:block;font-family:"Noto Sans TC";color:#6d7894;font-size:12px}
footer{text-align:center;font-size:11px;color:#6d7894;margin-top:18px;line-height:1.8}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="wrap">
  <div class="star">⭐</div>
  <div class="k">MERRY CHRISTMAS 2026</div>
  <h1>聖誕佳音小遊戲</h1>
  <p class="sub">兩款原創的聖誕節互動遊戲<br>適合教會、小組、主日學一起玩</p>
  <a class="card" href="./good-news.html"><div class="e">🌟</div><div><b>這個佳音，傳到你了</b><span>走一趟牧羊人的聖誕夜，<br>把好消息一站一站傳下去</span></div></a>
  <a class="card" href="./tree.html"><div class="e">🎄</div><div><b>爬上聖誕樹</b><span>7 道聖經題目，答對就往上爬，<br>點亮星星領取祝福經文</span></div></a>
  <p class="verse">「在至高之處榮耀歸與神！<br>在地上平安歸與他所喜悅的人！」<small>路加福音 2:14</small></p>
  <footer>經文引自《和合本》・不收集或儲存任何資料<br>© 2026 liva</footer>
</div>
<script>
(function(){ const cv=document.getElementById("sky"),cx=cv.getContext("2d"); let st=[];
  function rs(){ const d=devicePixelRatio||1; cv.width=innerWidth*d; cv.height=innerHeight*d; cx.setTransform(d,0,0,d,0,0);
    st=Array.from({length:120},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.3+.2,p:Math.random()*6.28})); }
  function tw(t){ cx.clearRect(0,0,innerWidth,innerHeight); for(const s of st){ cx.globalAlpha=.3+.6*Math.abs(Math.sin(t/1500+s.p)); cx.fillStyle="#fff"; cx.beginPath(); cx.arc(s.x,s.y,s.r,0,6.28); cx.fill(); } cx.globalAlpha=1; requestAnimationFrame(tw); }
  addEventListener("resize",rs); rs(); requestAnimationFrame(tw); })();
</script>
</body>
</html>
